# Scans every push for committed secrets (tokens, keys, passwords) with
# Trivy's secret scanner, on the cluster's own self-hosted runners. Unlike
# the web app's CI it has no path filter: a token can leak from any file,
# Terraform and scripts included. Every secret found fails the run and is
# listed on the run's summary page (.github/scripts/secret-summary.sh).
name: Secret scan

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  secrets:
    runs-on: [self-hosted, dokploy]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Trivy runs as a container on the node's Docker (as in the web app's
      # CI), where a bind mount would point at the node's filesystem, not
      # this job's. So the commit's tracked files go into the container as a
      # tar stream instead: git archive leaves out .git and anything
      # untracked. The secret scanner needs no vulnerability database.
      - name: Scan for secrets
        run: |
          cid=$(docker create aquasec/trivy:0.74.0 fs \
            --scanners secret --no-progress --format json --exit-code 1 /src)
          trap 'docker rm "$cid" >/dev/null' EXIT
          git archive --prefix=src/ HEAD | docker cp - "$cid:/"
          status=0
          docker start -a "$cid" >trivy-secrets.json || status=$?
          .github/scripts/secret-summary.sh trivy-secrets.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
