services:
  openbao:
    image: openbao/openbao:${OPENBAO_IMAGE_TAG}
    # The image's entrypoint turns this into `bao server -config=/openbao/config`
    # and drops root before starting it.
    command: server
    ports:
      # Routing mesh (ingress): the setup scripts and the web UI reach it on
      # <any node ip>:${OPENBAO_PORT}.
      - target: 8200
        published: ${OPENBAO_PORT}
        protocol: tcp
        mode: ingress
    networks:
      dokploy-network:
        # Dokploy's own server resolves secrets at deploy time, so it has to
        # reach OpenBao: this is the URL every provider in Dokploy uses.
        aliases:
          - openbao
    volumes:
      # /openbao/file already exists in the image, owned by the openbao user.
      - openbao-data:/openbao/file
    configs:
      - source: config
        target: /openbao/config/openbao.hcl
    secrets:
      - source: unseal_key
        target: openbao_unseal_key
    deploy:
      replicas: 1
      placement:
        # openbao-data is node-local: pin to the manager (the control
        # plane) so the task never lands on an empty volume elsewhere.
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

networks:
  dokploy-network:
    external: true

volumes:
  openbao-data:

configs:
  config:
    external: true
    name: ${OPENBAO_CONFIG}

secrets:
  unseal_key:
    external: true
    name: ${OPENBAO_UNSEAL_SECRET}
