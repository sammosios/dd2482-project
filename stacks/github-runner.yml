services:
  runner:
    # Pinned for reproducibility; the runner inside still self-updates when
    # GitHub requires it (GitHub rejects runners that fall too far behind).
    image: myoung34/github-runner:${RUNNER_IMAGE_TAG}
    # The image only reads the PAT from ACCESS_TOKEN, so load it from the
    # Swarm secret here instead of putting it in this file, which Dokploy
    # stores and shows in its UI. The image's entrypoint un-exports it again,
    # so jobs never see it.
    entrypoint:
      - /bin/bash
      - -c
      - ACCESS_TOKEN="$$(cat /run/secrets/github_pat)" exec /entrypoint.sh "$$@"
      - github-runner
    command: ["./bin/Runner.Listener", "run", "--startuptype", "service"]
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: ${GITHUB_REPO_URL}
      RUNNER_NAME_PREFIX: dokploy
      LABELS: ${RUNNER_LABELS}
      # One job per container: the runner deregisters after its job, the
      # container exits, Swarm starts a fresh one that registers again.
      EPHEMERAL: "true"
    volumes:
      # Jobs build and push images with the node's own Docker daemon. This is
      # root on that node for anything a workflow runs - fine for our own
      # repo's workflows, not for untrusted pull requests.
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - source: github_pat
        target: github_pat
    deploy:
      # One runner per worker: joining a worker adds a runner, and CI load
      # stays off the control plane, which already builds Dokploy's images.
      mode: global
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any

secrets:
  github_pat:
    external: true
    name: ${GITHUB_PAT_SECRET}
